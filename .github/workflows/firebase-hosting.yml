name: Publish Warming Up to Firebase

on:
  push:
    branches: [codex/warming-up-firebase]

permissions: {}

concurrency:
  group: warming-up-production-hosting
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == '1421511921' && github.repository_owner_id == '342332225'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check:personal-info
      - run: npm test
      - run: npm run test:domain
      - run: node --test firebase/tests/team-config.test.mjs
      - run: npm run check:types
      - run: npm run build
      - run: node scripts/check-public.mjs
      - run: node scripts/publish-hosting.mjs --check out
      - name: Check exported app
        run: |
          test -s out/index.html
          test -s out/login/index.html
          test -s out/connect/index.html
          test -z "$(find out -type l -print -quit)"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warming-up-${{ github.sha }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 2
      - name: Record the tested build
        run: |
          echo "Verified commit \`$GITHUB_SHA\`. [Open the team app](https://warming-up-bapmunna.web.app/)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Team owners can publish this exact artifact with `npm run release:hosting`.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: vars.WARMING_UP_AUTO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/codex/warming-up-firebase' && github.repository_id == '1421511921' && github.repository_owner_id == '342332225'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: firebase-hosting
      url: https://warming-up-bapmunna.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /firebase.json
            /scripts/publish-hosting.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/warming-up-release/out
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: warming-up-bapmunna
          workload_identity_provider: projects/446376297496/locations/global/workloadIdentityPools/github-hosting/providers/github-push
          audience: https://iam.googleapis.com/projects/446376297496/locations/global/workloadIdentityPools/github-hosting/providers/github-push
          service_account: github-hosting@warming-up-bapmunna.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish the checked export to the team's Hosting site
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/publish-hosting.mjs --publish "$RUNNER_TEMP/warming-up-release/out"
      - name: Verify the live homepage matches the build
        working-directory: ${{ runner.temp }}/warming-up-release
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "https://warming-up-bapmunna.web.app/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/live-index.html" && cmp -s out/index.html "$RUNNER_TEMP/live-index.html"; then exit 0; fi
            sleep 3
          done
          echo 'Published HTML could not be verified.' >&2
          exit 1
