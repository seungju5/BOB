name: Publish Warming Up to Firebase

on:
  push:
    branches: [codex/warming-up-firebase]

permissions: {}

concurrency:
  group: warming-up-production-hosting
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == '1421511921' && github.repository_owner_id == '342332225'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:domain
      - run: node --test firebase/tests/team-config.test.mjs
      - run: npm run check:types
      - run: npm run build
      - run: node scripts/check-public.mjs
      - name: Check exported app
        run: |
          test -s out/index.html
          test -s out/login/index.html
          test -s out/connect/index.html
          test -z "$(find out -type l -print -quit)"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warming-up-${{ github.sha }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/warming-up-firebase' && github.repository_id == '1421511921' && github.repository_owner_id == '342332225'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: firebase-hosting
      url: https://warming-up-bapmunna.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: firebase.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/warming-up-release/out
      - name: Prepare the audited Hosting CLI and static configuration
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/firebase/firebase-tools/releases/download/v15.37.0/firebase-tools-linux \
            -o "$RUNNER_TEMP/firebase"
          printf '%s  %s\n' 'f646ce0464f8d501441c88013bcb369c433630951d920afdc8b7023dcce40319' "$RUNNER_TEMP/firebase" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/firebase"
          jq -e '.hosting.site == "warming-up-bapmunna" and .hosting.public == "out"' firebase.json >/dev/null
          jq '{hosting:(.hosting | {site,public,ignore,headers,trailingSlash})}' firebase.json > "$RUNNER_TEMP/warming-up-release/firebase.json"
          test -s "$RUNNER_TEMP/warming-up-release/out/index.html"
      - name: Verify this commit is still the deployment branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/seungju5/BOB/git/ref/heads/codex/warming-up-firebase --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: warming-up-bapmunna
          workload_identity_provider: projects/446376297496/locations/global/workloadIdentityPools/github-hosting/providers/github-push
          audience: https://iam.googleapis.com/projects/446376297496/locations/global/workloadIdentityPools/github-hosting/providers/github-push
      - name: Publish only Hosting to the team project
        working-directory: ${{ runner.temp }}/warming-up-release
        run: '"$RUNNER_TEMP/firebase" deploy --only hosting --project warming-up-bapmunna --config firebase.json --non-interactive --message "seungju5/BOB@$GITHUB_SHA"'
      - name: Verify the live homepage matches the build
        working-directory: ${{ runner.temp }}/warming-up-release
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "https://warming-up-bapmunna.web.app/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/live-index.html" && cmp -s out/index.html "$RUNNER_TEMP/live-index.html"; then exit 0; fi
            sleep 3
          done
          echo 'Published HTML could not be verified.' >&2
          exit 1
