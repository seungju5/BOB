# Installation template only. An authorized maintainer can install in .github/workflows/.
name: Firebase parity

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'lib/**'
      - 'integrations/bapmunna-firebase/**'
      - 'scripts/sync-firebase.mjs'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/firebase-parity.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'config/**'
      - 'lib/**'
      - 'integrations/bapmunna-firebase/**'
      - 'scripts/sync-firebase.mjs'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/firebase-parity.yml'

permissions:
  contents: read

jobs:
  domain-and-design-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Check before rebuilding: rebuilding must not hide missing sync changes.
      - run: npm run check:firebase-sync
      - run: npm test
      - run: npm run test:firebase
      - run: npx tsc --noEmit
      - run: npm run build:firebase
      - name: Verify committed generated artifacts
        run: git diff --exit-code -- integrations/bapmunna-firebase/docs/shared integrations/bapmunna-firebase/docs/senior/index.html integrations/bapmunna-firebase/docs/carer/index.html integrations/bapmunna-firebase/workshop/bapmunna.html
